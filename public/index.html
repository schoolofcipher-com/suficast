<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#02372e; --ink:#f9ebce; --muted:#cfc6b1; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 16px 72px; text-align:center; color:var(--ink); background:var(--bg);
    font-family: Inter, system-ui, -apple-system, sans-serif;
  }
  h1 { line-height:0; }
  .logo { width:min(320px, 70vw); height:auto; display:block; }
  .tag { margin-top:22px; font-family:"Cormorant Garamond", Georgia, serif; font-style:italic; font-size:clamp(1.2rem,3.6vw,1.5rem); color:var(--ink); opacity:.9; }
  .divider { width:56px; height:1px; background:var(--ink); opacity:.5; margin:28px auto; }
  .soon { font-size:.8rem; letter-spacing:.32em; text-transform:uppercase; color:var(--ink); }
  p.lead { max-width:460px; margin-top:16px; line-height:1.7; color:var(--muted); font-size:1rem; }
  footer { position:absolute; bottom:20px; font-size:.75rem; color:var(--muted); opacity:.7; letter-spacing:.05em; }
  body { position:relative; }
</style>
</head>
<body>
  <h1><img class="logo" src="/logo.webp" width="640" height="637" alt="SufiCast"></h1>
  <p class="tag">Voices from the path of the heart</p>
  <div class="divider"></div>
  <p class="soon">Coming soon</p>
  <p class="lead">Sufi wisdom, poetry and spiritual traditions, through podcasts and audio storytelling. We're preparing something beautiful. Please check back soon, in sha' Allah.</p>
  <footer>&copy; <span id="y">2026</span> SufiCast</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
